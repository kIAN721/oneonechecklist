<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ship Voyage Checklist</title>
    <!-- Google Fonts & FontAwesome for icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-top">
                <div class="header-content">
                    <h1><i class="fa-solid fa-ship"></i> Voyage Checklist</h1>
                    <p class="subtitle">Prepare, pack, and check off everything before departure.</p>
                </div>
                <div id="sync-status" class="sync-badge syncing">
                    <i class="fa-solid fa-rotate fa-spin"></i> <span>Connecting...</span>
                </div>
            </div>

            <div class="progress-box">
                <div class="progress-stats">
                    <span id="progress-text">0 / 0 Completed</span>
                    <span id="progress-percent">0%</span>
                </div>
                <div class="progress-bar-container">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>
            </div>
        </header>

        <!-- Category Filter Tabs + Add Category Button -->
        <div class="category-bar">
            <div class="tab-container" id="category-tabs">
                <!-- Dynamically populated via js/script.js -->
            </div>
            <button id="open-cat-modal-btn" class="add-cat-btn" title="Create a new category">
                <i class="fa-solid fa-folder-plus"></i> + Category
            </button>
        </div>

        <!-- Add Custom Item Bar -->
        <div class="add-item-card">
            <input type="text" id="custom-item-input" placeholder="Add a custom item to pack...">
            <select id="custom-item-category">
                <!-- Dynamically populated via js/script.js -->
            </select>
            <button id="add-item-btn"><i class="fa-solid fa-plus"></i> Add</button>
        </div>

        <!-- Checklist Sections Wrapper -->
        <main class="checklist-wrapper" id="checklist-container">
            <!-- Dynamically populated via js/script.js -->
        </main>

        <!-- Footer Actions -->
        <footer class="footer-actions">
            <button id="reset-btn" class="btn-secondary"><i class="fa-solid fa-rotate-right"></i> Reset Checklist</button>
            <button id="export-btn" class="btn-primary"><i class="fa-solid fa-download"></i> Export Progress</button>
        </footer>
    </div>

    <!-- Modal 1: Add Custom Category -->
    <div id="category-modal" class="modal-overlay">
        <div class="modal-card">
            <h3><i class="fa-solid fa-folder-plus"></i> Add New Category</h3>
            <div class="modal-field">
                <label>Category Name</label>
                <input type="text" id="new-cat-name" placeholder="e.g., Shore Leave, Study & Manuals...">
            </div>
            <div class="modal-field">
                <label>Choose an Icon</label>
                <select id="new-cat-icon">
                    <option value="fa-anchor">⚓ Anchor / Maritime</option>
                    <option value="fa-helmet-safety">👷 Safety / PPE</option>
                    <option value="fa-compass">🧭 Navigation / Bridge</option>
                    <option value="fa-book">📚 Books & Manuals</option>
                    <option value="fa-bed">🛏️ Cabin & Bedding</option>
                    <option value="fa-mug-hot">☕ Galley / Food & Drinks</option>
                    <option value="fa-suitcase-rolling">🧳 Luggage & Shore Leave</option>
                    <option value="fa-dumbbell">🏋️ Gym & Fitness</option>
                    <option value="fa-headphones">🎧 Music & Entertainment</option>
                    <option value="fa-wallet">💵 Documents & Cash</option>
                    <option value="fa-box-open">📦 Miscellaneous</option>
                </select>
            </div>
            <div class="modal-actions">
                <button id="cancel-cat-btn" class="btn-secondary">Cancel</button>
                <button id="save-cat-btn" class="btn-primary">Create Category</button>
            </div>
        </div>
    </div>

    <!-- Modal 2: Edit Item (Text + Category) -->
    <div id="edit-item-modal" class="modal-overlay">
        <div class="modal-card">
            <h3><i class="fa-solid fa-pen"></i> Edit Checklist Item</h3>
            <div class="modal-field">
                <label>Item Name</label>
                <input type="text" id="edit-item-text">
            </div>
            <div class="modal-field">
                <label>Move to Category</label>
                <select id="edit-item-category"></select>
            </div>
            <div class="modal-actions">
                <button id="cancel-edit-btn" class="btn-secondary">Cancel</button>
                <button id="save-edit-btn" class="btn-primary">Save Changes</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/script.js"></script>
</body>
</html>
