<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ship Voyage Checklist</title>
    <!-- Google Fonts & FontAwesome for icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-top">
                <div class="header-content">
                    <h1><i class="fa-solid fa-ship"></i> Voyage Checklist</h1>
                    <p class="subtitle">Prepare, pack, and check off everything before departure.</p>
                </div>
                <div id="sync-status" class="sync-badge offline">
                    <i class="fa-solid fa-cloud"></i> <span>Local Mode</span>
                </div>
            </div>

            <div class="progress-box">
                <div class="progress-stats">
                    <span id="progress-text">0 / 0 Completed</span>
                    <span id="progress-percent">0%</span>
                </div>
                <div class="progress-bar-container">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>
            </div>
        </header>

        <!-- Category Filter Tabs -->
        <div class="tab-container" id="category-tabs">
            <button class="tab-btn active" data-category="all">All Items</button>
            <button class="tab-btn" data-category="documents">Documents & ID</button>
            <button class="tab-btn" data-category="clothing">Clothing & Gear</button>
            <button class="tab-btn" data-category="toiletries">Toiletries & Health</button>
            <button class="tab-btn" data-category="electronics">Electronics</button>
            <button class="tab-btn" data-category="operational">Operational & Tools</button>
        </div>

        <!-- Add Custom Item Bar -->
        <div class="add-item-card">
            <input type="text" id="custom-item-input" placeholder="Add a custom item to pack...">
            <select id="custom-item-category">
                <option value="documents">Documents & ID</option>
                <option value="clothing">Clothing & Gear</option>
                <option value="toiletries">Toiletries & Health</option>
                <option value="electronics">Electronics</option>
                <option value="operational">Operational & Tools</option>
            </select>
            <button id="add-item-btn"><i class="fa-solid fa-plus"></i> Add</button>
        </div>

        <!-- Checklist Sections Wrapper -->
        <main class="checklist-wrapper" id="checklist-container">
            <!-- Dynamically populated via js/script.js -->
        </main>

        <!-- Footer Actions -->
        <footer class="footer-actions">
            <button id="reset-btn" class="btn-secondary"><i class="fa-solid fa-rotate-right"></i> Reset Checklist</button>
            <button id="export-btn" class="btn-primary"><i class="fa-solid fa-download"></i> Export Progress</button>
        </footer>
    </div>

    <!-- IMPORTANT: type="module" is required for Firebase SDK imports -->
    <script type="module" src="js/script.js"></script>
</body>
</html>
